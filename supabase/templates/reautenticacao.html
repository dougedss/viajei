<!doctype html>
<html lang="pt-BR">
  <body
    style="
      margin: 0;
      padding: 32px 16px;
      background: #f4f4f2;
      color: #1c2230;
      font-family:
        'Barlow',
        -apple-system,
        'Segoe UI',
        Roboto,
        Helvetica,
        Arial,
        sans-serif;
      font-size: 17px;
      line-height: 1.5;
    "
  >
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
      <tr>
        <td align="center">
          <table
            role="presentation"
            width="100%"
            cellpadding="0"
            cellspacing="0"
            border="0"
            style="max-width: 440px; background: #ffffff; border-radius: 22px; padding: 28px 24px"
          >
            <tr>
              <td
                style="
                  font-family: 'Barlow Condensed', 'Arial Narrow', Arial, sans-serif;
                  font-size: 34px;
                  font-weight: 700;
                  letter-spacing: 0.02em;
                  color: #1c2230;
                  padding-bottom: 20px;
                "
              >
                Viajei<span style="color: #e8653a">.</span>
              </td>
            </tr>
            <tr>
              <td
                style="
                  font-family: 'Barlow Condensed', 'Arial Narrow', Arial, sans-serif;
                  font-size: 26px;
                  font-weight: 600;
                  line-height: 1.15;
                  padding-bottom: 10px;
                "
              >
                Seu código de confirmação
              </td>
            </tr>
            <tr>
              <td style="color: #5b6474; padding-bottom: 18px">
                Para confirmar que é você mesmo, digite este código no Viajei. Ele vale por poucos
                minutos.
              </td>
            </tr>
            <tr>
              <td style="padding-bottom: 22px">
                <span
                  style="
                    display: inline-block;
                    background: #141a26;
                    color: #e9c24a;
                    font-family: 'Barlow Condensed', 'Arial Narrow', Arial, sans-serif;
                    font-size: 34px;
                    font-weight: 700;
                    letter-spacing: 0.18em;
                    padding: 12px 20px;
                    border-radius: 14px;
                  "
                  >{{ .Token }}</span
                >
              </td>
            </tr>
            <tr>
              <td
                style="
                  color: #5b6474;
                  font-size: 14px;
                  border-top: 1px solid #e2e4e8;
                  padding-top: 16px;
                "
              >
                Não foi você? Ignore esta mensagem: sem o código, nada muda na sua conta.
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
