<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#F4F4F2" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#111722" media="(prefers-color-scheme: dark)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Viajei" />
    <title>Viajei</title>
    <script>
      // O tema escolhido no Perfil (fase 16), antes do primeiro quadro: nada pisca ao abrir. É a
      // `applyTheme` de src/lib/theme.ts escrita à mão (o mesmo `viajei:theme`, as mesmas cores).
      (function () {
        try {
          var t = localStorage.getItem('viajei:theme');
          if (t !== 'light' && t !== 'dark') return;
          document.documentElement.dataset.theme = t;
          var c = t === 'dark' ? '#111722' : '#F4F4F2';
          document.querySelectorAll('meta[name="theme-color"]').forEach(function (m) {
            m.setAttribute('content', c);
          });
        } catch (e) {
          /* sem localStorage: o tema do sistema */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/app/main.tsx"></script>
  </body>
</html>
