name: Laboratório

# O agente de testes da tela apagada: roda os cenários na produção, como dois aparelhos de mentira,
# nas máquinas do GitHub (nada depende deste Mac), e grava o resultado em lab_runs (painel /lab do
# app). Se algo falhar, o job fica vermelho e o GitHub avisa por e-mail. Todo dia às 3h07 de
# Brasília (06:07 UTC; fora do minuto cheio, que o GitHub atrasa) e quando alguém pedir.
# O GitHub entrega o agendado quando pode: de 09 a 14/11/2026 o evento "schedule" nasceu entre 13h24 e
# 16h04 UTC (10h a 13h de Brasília), 7 a 10 h depois do cron, todos os dias; o horário de verdade
# está em lab_runs.started_at. Nenhum cenário depende do horário a não ser pela meia-noite (pulam
# até 0h30). Sob demanda:
# Actions → Laboratório → Run workflow, ou `pnpm lab:remote`.
# O GitHub registra o cron quando este arquivo chega na main. O push que o criou (05/11, 23:48 UTC)
# caiu num incidente do Actions e o agendamento nunca rodou; se o histórico voltar a ficar sem
# execuções "schedule", um commit que toque este arquivo na main registra o cron de novo.
# Desde a fase 8 o navegador também faz o roteiro das fases 7 e 8 (listas, missões, contatos, gastos,
# reservas e fotos sem rede) e dois avisos são conferidos em dois dias (véspera e prazo): cada
# execução confere o que a anterior armou e arma o próximo ciclo.
# Desde a fase 10 o lab-a também lê um roteiro curto com a IA de verdade, uma vez por dia (D139); a
# chave da Anthropic mora na função, e nenhum secret novo entra aqui. A tarefa `medir-importacao`
# (Run workflow → tarefa) roda só a medição do pensamento da IA, sem os cenários (D133).
# O laboratório testa o preview da branch antes do merge e a produção depois (D106). O agendado
# testa sempre a produção. Para a branch (o preview da Vercel, atrás do login dela, com o mesmo banco):
#   gh workflow run lab.yml --repo dougedss/viajei --ref fase-11 -f alvo=preview
# Precisa do secret VERCEL_AUTOMATION_BYPASS_SECRET (Vercel → Settings → Deployment Protection →
# Protection Bypass for Automation); o segredo vai só na primeira navegação, nunca nos logs.
# Desde a fase 18, o cenário `app_email_recebido` envia um e-mail de verdade pela API do Resend, do
# remetente do app para o endereço do lab-a, se o secret RESEND_API_KEY existir no Actions (é do
# Douglas); sem ele, ou com a função de recebimento ainda sem as chaves, o cenário é pulado com o motivo.
on:
  schedule:
    - cron: '7 6 * * *'
  workflow_dispatch:
    inputs:
      tarefa:
        description: 'laboratorio: os cenários de sempre; medir-importacao: a medição do pensamento da IA (D133); medir-conversa: o custo e o tempo de uma conversa e de uma saída de hoje (fase 17); medir-leitura: a leitura da confirmação em texto, PDF e print e a da nota, uma vez, com entradas inventadas (fase 18); medir-desempenho: só o Lighthouse, com os relatórios; medir-sync: o envio do rack, 3 vezes, com o rastro do motor (fase 13)'
        type: choice
        options:
          [
            laboratorio,
            medir-importacao,
            medir-conversa,
            medir-leitura,
            medir-desempenho,
            medir-sync,
          ]
        default: laboratorio
      alvo:
        description: 'Onde o navegador abre o app: a produção ou o preview da branch escolhida acima (D106)'
        type: choice
        options: [producao, preview]
        default: producao

concurrency:
  group: laboratorio
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  laboratorio:
    name: os cenários de ponta a ponta
    runs-on: ubuntu-latest
    # a exportação do vídeo da retrospectiva leva até ~25 min numa máquina lenta (D151), e a
    # instalação do Chromium pode tentar de novo (fase 16)
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Instalar dependências
        run: pnpm install --frozen-lockfile

      # com novas tentativas: em 11/11 a máquina ficou sem DNS para o apt e nada rodou (fase 16, 3.0)
      - name: Chromium (o navegador que faz o roteiro manual)
        timeout-minutes: 32
        run: scripts/ci/navegadores.sh chromium

      - name: Laboratório
        run: pnpm lab --target production ${{ inputs.tarefa != 'laboratorio' && inputs.tarefa && format('--{0}', inputs.tarefa) || '' }}
        env:
          LAB_SECRET: ${{ secrets.LAB_SECRET }}
          # agendado: sempre a produção; sob demanda: a escolha do formulário
          LAB_ALVO: ${{ inputs.alvo || 'producao' }}
          LAB_BRANCH: ${{ github.ref_name }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          # opcional (fase 18): sem ele, o cenário do e-mail é pulado com o motivo
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}

      # sempre: além dos prints das falhas e dos relatórios das medições, a captura da maquete com
      # as miniaturas (fase 14), para o Douglas ver
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: laboratorio
          path: lab-artifacts
          retention-days: 14
          if-no-files-found: ignore
