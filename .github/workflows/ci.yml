name: CI

# Nenhum teste roda no Mac (D91): a branch de cada fase passa por aqui antes de chegar à main.
on:
  push:
    branches: [main, 'fase-*']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    name: lint, tipos, Vitest, pgTAP, build e Playwright
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Instalar dependências
        run: pnpm install --frozen-lockfile

      - name: Lint e formatação
        run: |
          pnpm lint
          pnpm format:check

      - name: Supabase local (Postgres, Auth, PostgREST, Realtime, Storage)
        run: pnpm exec supabase start -x studio,imgproxy,logflare,vector,mailpit

      # uma falha do pgTAP não esconde o resto da volta: a CI segue e falha no fim (passo abaixo)
      - name: pgTAP
        id: pgtap
        continue-on-error: true
        run: pnpm exec supabase test db

      # Sem stack local (D91), os tipos do banco só nascem aqui. Se mudaram, o arquivo gerado vira o
      # artefato "tipos-do-banco" e o resto da CI roda com ele; a CI falha no fim, para o arquivo ser
      # commitado (`gh run download <id> -n tipos-do-banco -D src/lib/supabase`).
      - name: Tipos do banco (gerados do Supabase desta CI)
        id: tipos-banco
        run: |
          pnpm db:types
          if git diff --quiet -- src/lib/supabase/database.types.ts; then
            echo "mudou=false" >> "$GITHUB_OUTPUT"
          else
            echo "mudou=true" >> "$GITHUB_OUTPUT"
            git diff --stat -- src/lib/supabase/database.types.ts
          fi

      - uses: actions/upload-artifact@v4
        if: steps.tipos-banco.outputs.mudou == 'true'
        with:
          name: tipos-do-banco
          path: src/lib/supabase/database.types.ts
          retention-days: 7

      - name: Tipos
        run: pnpm typecheck

      - name: Vitest
        run: pnpm test

      - name: Variáveis do Supabase local para o app
        run: |
          eval "$(pnpm exec supabase status -o env)"
          echo "VITE_SUPABASE_URL=$API_URL" >> "$GITHUB_ENV"
          echo "VITE_SUPABASE_PUBLISHABLE_KEY=$PUBLISHABLE_KEY" >> "$GITHUB_ENV"

      - name: Build
        run: pnpm build

      - name: Playwright
        run: |
          pnpm exec playwright install --with-deps chromium
          pnpm test:e2e

      - name: Tipos do banco batem com o commit
        if: steps.tipos-banco.outputs.mudou == 'true'
        run: |
          echo "::error file=src/lib/supabase/database.types.ts::não bate com o banco desta CI; baixe o artefato tipos-do-banco e commite"
          exit 1

      - name: pgTAP passou
        if: steps.pgtap.outcome == 'failure'
        run: |
          echo "::error::o pgTAP falhou: veja o passo pgTAP acima"
          exit 1

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
